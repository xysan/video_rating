services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请填写根目录 .env}
      MYSQL_USER: ${MYSQL_USER:?请填写根目录 .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请填写根目录 .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请填写根目录 .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:?请填写根目录 .env}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
